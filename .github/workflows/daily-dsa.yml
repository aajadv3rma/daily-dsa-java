name: Daily DSA Practice

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-dsa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch daily DSA problem and generate Java starter
        run: python3 .github/scripts/daily_dsa.py

      - name: Commit and push daily DSA problem
        run: |
          git config user.name "Aajad Verma"
          git config user.email "guruviper786@gmail.com"
          COMMIT_MSG=$(cat .commit_msg.txt)
          rm -f .commit_msg.txt
          git add daily-dsa/
          git diff --staged --quiet || (git commit -m "$COMMIT_MSG" && git push)
